<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="rift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8b6ff"/>
      <stop offset="40%" stop-color="#6ea8fe"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 裂隙圆环 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#c8b6ff" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#6ea8fe" stroke-width="2" opacity="0.4"/>
  <!-- 中心裂隙 -->
  <ellipse cx="256" cy="256" rx="96" ry="120" fill="url(#rift)" opacity="0.9"/>
  <!-- 科技与灵气符号 -->
  <g transform="translate(256,256)" opacity="0.95">
    <!-- 左侧灵气符号（太极点简化） -->
    <circle cx="-52" cy="0" r="18" fill="#86efac"/>
    <circle cx="-52" cy="-8" r="6" fill="#0a0a12"/>
    <!-- 右侧科技符号（电路节点） -->
    <rect x="44" y="-14" width="28" height="28" rx="4" fill="url(#tech)"/>
    <line x1="38" y1="0" x2="44" y2="0" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="72" cy="0" r="5" fill="#fff"/>
  </g>
  <!-- 顶部标题 -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="bold" fill="#c8b6ff" letter-spacing="8">两界之间</text>
</svg>
